name: Publish SDK to npm (Trusted Publishing)

# Publie le paquet lors d'une Release GitHub (ou manuellement via l'onglet Actions),
# via npm Trusted Publishing (OIDC) : aucun token npm stocké, provenance automatique.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # requis pour l'OIDC (Trusted Publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing exige un npm récent (>= 11.5.1). Node 24 embarque déjà
      # npm 11.x ; on force la dernière version par sûreté (compatible Node 24).
      - name: Mettre npm à jour
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Sur une Release, le tag doit correspondre à la version du paquet (v1.0.0 ↔ 1.0.0).
      - name: Vérifier tag = version
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ≠ package.json $PKG"; exit 1
          fi

      - name: Typecheck et tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # Aucun NODE_AUTH_TOKEN : l'auth se fait par OIDC (le dépôt + ce workflow
      # doivent être déclarés comme « Trusted Publisher » sur la page npm du paquet).
      - name: Publish
        run: npm publish
