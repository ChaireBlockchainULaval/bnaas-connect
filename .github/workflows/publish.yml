name: Publish SDK to GitHub Packages

# Publie le paquet lorsqu'une Release GitHub est publiée (recommandé), ou
# manuellement via l'onglet Actions.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          # Token npm (Automation) à configurer dans les secrets du dépôt.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
